name: Archlinux Rootfs

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构（x86_64 / aarch64 / arm 等）"
        required: false
        default: "x86_64"
      repo:
        description: "仓库 URL（留空使用官方默认镜像）"
        required: false
        default: ""
  schedule:
    # 北京时间每周日 00:00，对应 UTC 周六 16:00
    - cron: "0 16 * * 6"

jobs:
  archlinux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README latest update date
        run: |
          TZ=Asia/Shanghai
          DATE_STR=$(TZ=$TZ date '+%Y-%m-%d %H:%M:%S %Z')
          sed -i "s/^-\ Latest Update:.*/- Latest Update: ${DATE_STR}/" README.md

      - name: Bootstrap Arch Linux
        env:
          ARCH: ${{ github.event.inputs.arch || 'x86_64' }}
          REPO_URL: ${{ github.event.inputs.repo || '' }}
        run: |
          set -e
          ARGS=(-a "$ARCH")
          [[ -n "$REPO_URL" ]] && ARGS+=(-r "$REPO_URL")
          # arch-bootstrap.sh 内部会 chroot/mknod/cp 系统文件，必须以 root 运行
          sudo bash -x arch-bootstrap.sh "${ARGS[@]}" "$GITHUB_WORKSPACE/archlinux"

      - name: Package rootfs
        run: |
          sudo tar -I "xz -T$(nproc) -9" \
            -cf /tmp/archlinux-latest.tar.xz \
            -C "$GITHUB_WORKSPACE" archlinux

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Arch Linux
          draft: false
          prerelease: false
          tag_name: archlinux-latest
          body: |
            Arch Linux
          files: /tmp/archlinux-latest.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README latest update date
        if: success()
        continue-on-error: true
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update Archlinux latest date"
            git pull --rebase --autostash
            git push
          fi
          
