name: Wine x86-64 Build Container

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:

jobs:
  archlinux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README wine latest update date & Install depends
        run: |
          set -e
          TZ=Asia/Shanghai

          # 下载并解压 rootfs
          echo "📥 下载 rootfs..."
          wget -O archlinux-latest.tar.xz https://github.com/as14725836/BCC/releases/download/archlinux-latest/archlinux-latest.tar.xz
          sudo tar -xf archlinux-latest.tar.xz -C /tmp

          # 修复脚本
          echo "🔧 修复脚本..."
          # 确保使用 LF 行尾
          dos2unix Wine_x86-64-bcc.sh 2>/dev/null || sed -i 's/\r$//' Wine_x86-64-bcc.sh
          # 添加执行权限
          chmod +x Wine_x86-64-bcc.sh

          DATE_STR=$(TZ=$TZ date '+%Y-%m-%d %H:%M:%S %Z')
          echo "📝 更新 README: ${DATE_STR}"
          sed -i "s/^- Wine x86-64 BCC Latest Update:.*/- Wine x86-64 BCC Latest Update: ${DATE_STR}/" README.md
          
          echo "🔧 复制文件..."
          sudo mkdir -p /tmp/archlinux/bin
          sudo cp Wine_x86-64-bcc.sh /tmp/archlinux/bin/
          sudo cp mount.sh /tmp/

          echo "🔄 执行 chroot..."
          cd /tmp
          bash mount.sh mount archlinux
          
          # 使用 bash -c 执行
          sudo chroot archlinux /bin/bash -c "cd /bin && bash Wine_x86-64-bcc.sh"
          
          bash mount.sh unmount archlinux
          
          echo "✅ 完成!"

      - name: Package
        run: |
          cd /tmp
          sudo tar -I 'xz -T$(nproc)' -cvf wine-bcc.tar.xz archlinux

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Wine x86-64 BCC
          draft: false
          prerelease: false
          tag_name: wine-bcc-latest
          body: |
            Wine x86-64 BCC rootfs
          files: /tmp/wine-bcc.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README wine latest update date
        if: success()
        continue-on-error: true
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update Wine x86-64 BCC latest date"
            git pull --rebase --autostash
            git push
          fi
          
